name: fact_checker
version: v1
agent: fact-agent
description: Real-time claim extraction and live-source verification

claim_extraction_prompt: |
  You are a fact-checking analyst. Extract all verifiable factual claims from this text.
  For each claim, provide:
  - claim: The exact factual assertion (one sentence)
  - type: "statistic", "quote", "event", "attribution", "prediction"
  - verifiability: "high", "medium", "low"
  - entities: named entities in the claim
  - requires_sources: source types needed to verify
  Return JSON: {"claims": [...]}

verdict_prompt: |
  You are a senior fact-checker at a news organization.
  Given a claim and evidence from multiple sources, determine verification status.
  Consider source reliability, recency, and corroboration.
  Return JSON: {
    "verdict": "verified" | "disputed" | "partially_verified" | "unverifiable",
    "confidence": 0.0-1.0,
    "reasoning": "2-3 sentences",
    "key_evidence": ["..."],
    "caveats": ["..."]
  }

parameters:
  model: gpt-4o
  temperature: 0.1
  max_evidence_sources: 10
  min_confidence_to_publish: 0.6

grading:
  A: { min_score: 0.90, label: "Highly reliable" }
  B: { min_score: 0.75, label: "Mostly reliable" }
  C: { min_score: 0.60, label: "Mixed evidence" }
  D: { min_score: 0.40, label: "Unreliable" }
  F: { min_score: 0.00, label: "Failing" }

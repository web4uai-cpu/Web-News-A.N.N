global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "infrastructure/monitoring/alerting-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8001"]

  - job_name: "article-service"
    static_configs:
      - targets: ["article-service:8002"]

  - job_name: "video-service"
    static_configs:
      - targets: ["video-service:8003"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8004"]

  - job_name: "analytics-service"
    static_configs:
      - targets: ["analytics-service:8005"]

  - job_name: "search-service"
    static_configs:
      - targets: ["search-service:8006"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

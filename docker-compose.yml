version: '3.8'

services:

  # ── API Gateway (public entry point) ────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONOLITH_URL=http://ann-backend:8080
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ARTICLE_SERVICE_URL=http://ann-backend:8080
      - VIDEO_SERVICE_URL=http://ann-backend:8080
      - NOTIFICATION_SERVICE_URL=http://ann-backend:8080
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=*
    depends_on:
      redis:
        condition: service_healthy
      ann-backend:
        condition: service_started
    restart: unless-stopped

  # ── Auth Service ────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Legacy Monolith (serves unextracted routes) ─────────
  ann-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/output:/app/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Celery Worker ───────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/output:/app/output
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info
    restart: unless-stopped

  # ── Prometheus ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    depends_on:
      - api-gateway

  # ── Grafana ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      - prometheus

version: '3.8'

services:

  # ── API Gateway (public entry point) ────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONOLITH_URL=http://ann-backend:8080
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ARTICLE_SERVICE_URL=http://article-service:8002
      - VIDEO_SERVICE_URL=http://video-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8006
      - ANALYTICS_SERVICE_URL=http://analytics-service:8004
      - SEARCH_SERVICE_URL=http://search-service:8005
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=*
    depends_on:
      redis:
        condition: service_healthy
      ann-backend:
        condition: service_started
    restart: unless-stopped

  # ── Auth Service ────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Article Service ─────────────────────────────────────
  article-service:
    build:
      context: ./backend/article-service
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    env_file:
      - ./backend/article-service/.env
    restart: unless-stopped

  # ── Video Service ──────────────────────────────────────
  video-service:
    build:
      context: ./backend/video-service
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    env_file:
      - ./backend/video-service/.env
    volumes:
      - ./backend/output:/app/output
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Notification Service ────────────────────────────────
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8006:8006"
    environment:
      - PORT=8006
    env_file:
      - ./backend/notification-service/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Analytics Service ──────────────────────────────────
  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
    env_file:
      - ./backend/analytics-service/.env
    restart: unless-stopped

  # ── Search Service ─────────────────────────────────────
  search-service:
    build:
      context: ./backend/search-service
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - ARTICLE_SERVICE_URL=http://article-service:8002
    env_file:
      - ./backend/search-service/.env
    restart: unless-stopped

  # ── Main Backend (monolith — primary pipeline engine) ────
  ann-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - ARTICLE_SERVICE_URL=http://article-service:8002
      - SEARCH_SERVICE_URL=http://search-service:8005
      - NOTIFICATION_SERVICE_URL=http://notification-service:8006
      - ANALYTICS_SERVICE_URL=http://analytics-service:8004
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/output:/app/output
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Celery Worker ───────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/output:/app/output
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info
    restart: unless-stopped

  # ── Prometheus ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    depends_on:
      - api-gateway

  # ── Grafana ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      - prometheus

# ============================================
# A.N.N. — Railway Project Configuration
# ============================================
# Services with a Root Directory set (api-gateway, article-service, …) use their
# own railway.toml. This root config is used by the ann-backend monolith service,
# which builds from the repository root via Dockerfile.ann-backend.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.ann-backend"
watchPatterns = ["backend/**", "agents/**", "Dockerfile.ann-backend"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

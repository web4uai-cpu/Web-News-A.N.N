# ═══════════════════════════════════════════════════════
# A.N.N. Modular Monolith (ann-backend) — the primary application
# The microservices in services.yaml are opt-in extraction targets;
# this Deployment is what actually serves the product.
# ═══════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ann-backend
  namespace: ann
  labels:
    app: ann-backend
    tier: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ann-backend
  template:
    metadata:
      labels:
        app: ann-backend
        tier: core
    spec:
      containers:
        - name: ann-backend
          image: ghcr.io/OWNER/REPO/ann-backend:latest  # set by CI: kubectl set image
          ports:
            - containerPort: 8000
          env:
            - name: ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: ann-config
            - secretRef:
                name: ann-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ann-backend
  namespace: ann
spec:
  selector:
    app: ann-backend
  ports:
    - port: 8080
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ann-backend
  namespace: ann
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ann-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
